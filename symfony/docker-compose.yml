name: mdevoldere-symfony-2503
services: 
  db:
    image: mariadb:11
    container_name: mdevoldere-symfony-2503-mysql
    restart: always
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: test
      MYSQL_USER: user 
      MYSQL_PASSWORD: user
      MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
      MYSQL_ROOT_PASSWORD: root

  web:
    # image: "php:8.4-apache"
    container_name: mdevoldere-symfony-2503-apache2
    build: .
    restart: always
    depends_on: ['db']
    ports: ['8000:80']
    links: ['db:db']
    volumes:
      - './myapi/:/var/www/html'
    environment:
      MYSQL_DB_HOST: db
      MYSQL_DATABASE: test
      MYSQL_USER: user 
      MYSQL_PASSWORD: user

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    container_name: mdevoldere-symfony-2503-phpmyadmin
    restart: always
    depends_on: ['db']
    ports: ['1200:80']
    links: ['db:db']
    environment:
      - MYSQL_DB_HOST=db
      - MYSQL_USER=user 
      - MYSQL_PASSWORD=user


volumes:
  db_data: {}
